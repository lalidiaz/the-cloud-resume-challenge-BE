name: Deploy Infrastructure for The Cloud Resume Challenge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  terraform:
    name: Deploy with Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository to the runner
        uses: actions/checkout@v3

      - name: Setup Terraform with specified version on the runner
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.11.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create Lambda function file
        run: |
          echo "${{ secrets.LAMBDA_CODE }}" > ../index.py
          ls -la ../index.py

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run:  terraform plan -var 'bucket_name=${{ secrets.BUCKET_NAME }}' -var 'domain_name=${{ secrets.DOMAIN_NAME }}' -var 'aws_region=${{ secrets.AWS_REGION }}' -var 'email=${{ secrets.EMAIL }}' -var 'table_name=${{ secrets.AWS_TABLE_NAME }}'

      - name: Terraform Apply
        run: terraform apply -auto-approve -var 'bucket_name=${{ secrets.BUCKET_NAME }}' -var 'domain_name=${{ secrets.DOMAIN_NAME }}' -var 'aws_region=${{ secrets.AWS_REGION }}' -var 'email=${{ secrets.EMAIL }}' -var 'table_name=${{ secrets.AWS_TABLE_NAME }}'
